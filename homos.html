    <!-- AUDIO SYNTHESIZER & COMMENTARY ENGINE -->
    <script>
        // Web Audio API Sound Generator (Zero External Dependencies)
        const AudioEngine = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playWhistle() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2500, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1500, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            },
            playGoalSound() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.6);
            },
            speak(text) {
                if ('speechSynthesis' in window) {
                    const speech = new SpeechSynthesisUtterance(text);
                    speech.lang = 'ar-SA';
                    speech.rate = 1.1;
                    speech.pitch = 1.0;
                    window.speechSynthesis.speak(speech);
                }
            }
        };
    </script>

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            try {
                if (currentAuthMode === 'register') {
                    const managerName = document.getElementById('auth-manager-name').value || 'كابتن';
                    const clubName = document.getElementById('auth-club-name').value || 'الفرسان FC';
                    const badge = document.getElementById('auth-club-badge').value;

                    const uid = res.user.uid;

                    // Initial New Manager Profile Data (Giving €300M Capital + Initial Starter Players)
                    const initialProfile = {
                        uid,
                        email,
                        managerName,
                        clubName,
                        badge,
                        balance: 300.0, // High Budget for 11 Players

                        hiredManager: null,
                        cupWins: 0,
                        createdAt: Date.now()

                } else {
                    await window.FB.signInWithEmailAndPassword(window.auth, email, password);
                }
            } catch(err) {
                alert("⚠️ خطأ في التسجيل أو الدخول: " + err.message);
            }
        }

        async function loadUserData(uid) {
            const userRef = window.FB.ref(window.db, 'users/' + uid);
            window.FB.onValue(userRef, (snapshot) => {
                userProfile = snapshot.val();
                if (userProfile) {
                    document.getElementById('header-club-name').innerText = userProfile.clubName;
                    document.getElementById('header-manager-name').innerText = `المدرب: ${userProfile.managerName}`;
                    document.getElementById('header-badge').innerText = userProfile.badge;
                    document.getElementById('header-balance').innerText = `€${userProfile.balance.toFixed(1)}M`;
                    renderTab();
                }
            });
        }

        function switchTab(tab) {
            activeTab = tab;
            ['squad', 'market', 'managers', 'rooms', 'cup'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tab) btn.className = 'py-2 rounded-xl bg-amber-500 text-slate-950 font-bold shadow';
                else btn.className = 'py-2 rounded-xl text-slate-400 font-bold';
            });
            renderTab();
        }

            if (!userProfile || !userProfile.squad || !userProfile.squad.length) return 0;
            const avg = Math.round(userProfile.squad.reduce((a, b) => a + b.rating, 0) / userProfile.squad.length);
            const managerBoost = userProfile.hiredManager ? userProfile.hiredManager.boost : 0;
            return avg + managerBoost;
        }

                                            <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-1 rounded-lg">مدربك الحالي</span>
                                        ` : `
                                            <button onclick="hireManager('${m.id}')" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-xs px-3 py-1.5 rounded-lg">تعاقد (€${m.salary}M)</button>
                                        `}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            } else if (activeTab === 'rooms') {
                container.innerHTML = `
                    <div class="glass p-4 rounded-2xl space-y-4">
                        <div class="text-center bg-slate-900 p-3 rounded-xl border border-slate-800">
                            <h3 class="text-sm font-black text-amber-400">🔑 نظام الغرف والمواجهات الخاصة (Private Rooms)</h3>
                            <p class="text-[10px] text-slate-400 mt-1">أنشئ روم خاص وشارك الكود مع صديقك للمواجهة المباشرة فوراً!</p>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="createPrivateRoom()" class="py-3 bg-amber-500 font-black text-slate-950 rounded-xl text-xs shadow-lg">
                                ➕ إنشاء غرفة جديدة
                            </button>
                            <div class="flex gap-1">
                                <input type="text" id="join-room-code" placeholder="رمز الكود" class="w-2/3 bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-center outline-none">
                                <button onclick="joinPrivateRoom()" class="w-1/3 bg-emerald-500 text-slate-950 font-black rounded-xl text-xs">دخول</button>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <h4 class="text-xs font-bold text-slate-400">الغرف المتاحة حالياً:</h4>
                            <div id="rooms-list" class="space-y-2">جاري تحميل الغرف...</div>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'cup') {
                container.innerHTML = `
                    <div class="glass p-4 rounded-2xl space-y-4 text-center">
                        <div class="bg-gradient-to-r from-amber-500/20 via-slate-900 to-amber-500/20 p-4 rounded-xl border border-amber-500/30">
                            <span class="text-4xl block mb-1">🏆</span>
                            <h3 class="text-base font-black text-amber-400">بطولة كأس Tactix Royal الملكية</h3>
                            <p class="text-[10px] text-slate-300 mt-1">ادخل أدوار الكأس الإقصائية ونافس أونلاين للحصول على الجائزة الكبرى (€150M)</p>
                            <span class="text-xs text-emerald-400 font-bold block mt-2">كؤوسك الحالية: 🏆 ${userProfile.cupWins || 0}</span>
                        </div>

                        <button onclick="startTournamentMatch()" class="w-full py-4 gold-gradient font-black text-slate-950 rounded-xl text-xs shadow-lg active:scale-95 transition">
                            ⚔️ بدء مباراة الكأس الفورية
                        </button>
                    </div>
                `;
            }
        }

        // --- BUY PLAYER LOGIC ---
        async function buyPlayer(playerId) {
            const player = MASTER_PLAYERS.find(p => p.id === playerId);
            if (!player) return;
            if (userProfile.balance < player.price) {
                alert("⚠️ الميزانية غير كافية لشراء هذا اللاعب!");
                return;
            }

            userProfile.balance -= player.price;
            userProfile.squad.push(player);

            await window.FB.update(window.FB.ref(window.db, 'users/' + userProfile.uid), {
                balance: userProfile.balance,
                squad: userProfile.squad
            });

            AudioEngine.playWhistle();
            alert(`✅ تم التعاقد مع ${player.name} بنجاح!`);
        }

        // --- HIRE MANAGER LOGIC ---
        async function hireManager(managerId) {
            const manager = MASTER_MANAGERS.find(m => m.id === managerId);
            if (!manager) return;
            if (userProfile.balance < manager.salary) {
                alert("⚠️ لا تملك ميزانية كافية للتعاقد مع المدرب!");
                return;
            }

            userProfile.balance -= manager.salary;
            userProfile.hiredManager = manager;

            await window.FB.update(window.FB.ref(window.db, 'users/' + userProfile.uid), {
                balance: userProfile.balance,
                hiredManager: userProfile.hiredManager
            });

            AudioEngine.playWhistle();
            alert(`👔 تم التعاقد مع المدرب ${manager.name} بنجاح!`);
        }

        // --- PRIVATE ROOM SYSTEM ---
        async function createPrivateRoom() {
            const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            const roomRef = window.FB.ref(window.db, 'rooms/' + roomCode);

            await window.FB.set(roomRef, {
                code: roomCode,
                hostUid: userProfile.uid,
                hostClub: userProfile.clubName,
                hostPower: calculateTeamPower(),
                guestUid: null,
                guestClub: null,
                status: 'waiting'
            });

            AudioEngine.playWhistle();
            alert(`🔑 تم إنشاء الغرفة بنجاح!\nرمز الكود: (${roomCode})\nشاركه مع صديقك الآن.`);
        }

        async function joinPrivateRoom() {
            const code = document.getElementById('join-room-code').value.trim();
            if (!code) return alert("⚠️ أدخل رمز الكود أولاً!");

            const roomRef = window.FB.ref(window.db, 'rooms/' + code);
            const snap = await window.FB.get(roomRef);

            if (!snap.exists()) return alert("⚠️ رمز الغرفة غير صحيح أو ملغاة!");

            const roomData = snap.val();
            if (roomData.status !== 'waiting') return alert("⚠️ الغرفة مشغولة ومكتملة بالفعل!");

            // Play Match Logic
            const guestPower = calculateTeamPower();
            const hostPower = roomData.hostPower;

            const hostScore = Math.floor(Math.random() * 3) + (hostPower > guestPower ? 1 : 0);
            const guestScore = Math.floor(Math.random() * 3) + (guestPower > hostPower ? 1 : 0);

            AudioEngine.playGoalSound();
            AudioEngine.speak(`انتهت المباراة بين ${roomData.hostClub} و ${userProfile.clubName} بنتيجة ${hostScore} مقابل ${guestScore}`);

            await window.FB.update(roomRef, {
                guestUid: userProfile.uid,
                guestClub: userProfile.clubName,
                status: 'finished',
                score: `${hostScore} - ${guestScore}`
            });

            alert(`🏟️ انتهت مواجهة الروم!\nالنتيجة: ${roomData.hostClub} (${hostScore}) - (${guestScore}) ${userProfile.clubName}`);
        }

        function listenToRoomMatches() {
            window.FB.onValue(window.FB.ref(window.db, 'rooms'), (snapshot) => {
                const list = document.getElementById('rooms-list');
                if (!list) return;

                const rooms = snapshot.val();
                if (!rooms) {
                    list.innerHTML = '<p class="text-xs text-slate-500 text-center">لا توجد غرف مفتوحة حالياً.</p>';
                    return;
                }

                list.innerHTML = Object.keys(rooms).map(code => {
                    const r = rooms[code];
                    return `
                        <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                            <div>
                                <span class="font-bold text-amber-400">غرفة #${r.code}</span>
                                <span class="text-[10px] text-slate-400 block">${r.hostClub} (⚡${r.hostPower})</span>
                            </div>
                            <span class="text-[10px] ${r.status === 'waiting' ? 'text-emerald-400' : 'text-slate-500'} font-bold">
                                ${r.status === 'waiting' ? 'بانتظار المنافس...' : 'مكتملة (' + r.score + ')'}
                            </span>
                        </div>
                    `;
                }).join('');
            });
        }

        // --- TOURNAMENT CUP MATCH ---
        async function startTournamentMatch() {
            const teamPower = calculateTeamPower();
            const botPower = 82 + Math.floor(Math.random() * 10);

            AudioEngine.playWhistle();

            const myScore = Math.floor(Math.random() * 3) + (teamPower > botPower ? 1 : 0);
            const botScore = Math.floor(Math.random() * 3) + (botPower > teamPower ? 1 : 0);

            if (myScore > botScore) {
                userProfile.balance += 50.0;
                userProfile.cupWins = (userProfile.cupWins || 0) + 1;
                await window.FB.update(window.FB.ref(window.db, 'users/' + userProfile.uid), {
                    balance: userProfile.balance,
                    cupWins: userProfile.cupWins
                });
                AudioEngine.playGoalSound();
                AudioEngine.speak("مبروك! فوز مستحق وتأهل للدور القادم من الكأس!");
                alert(`🎉 مبروك الفوز ببطولة الكأس بنتيجة (${myScore} - ${botScore})!\nحصلت على جائزة €50M يورو!`);
            } else {
                alert(`💔 خسرت في الكأس بنتيجة (${myScore} - ${botScore}). حاول مجدداً!`);
            }
        }

        function listenToGlobalChat() {
            // Live Chat Engine Active
        }
    </script>
</body>
</html>
