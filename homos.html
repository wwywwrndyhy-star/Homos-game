        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, child, onValue, push, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCBEtbRajG95opDRkHbstnmt79a4v8lUX0",
          authDomain: "xojs-4e0dc.firebaseapp.com",
          databaseURL: "https://xojs-4e0dc-default-rtdb.firebaseio.com",
          projectId: "xojs-4e0dc",
          storageBucket: "xojs-4e0dc.firebasestorage.app",
          messagingSenderId: "504484947768",
          appId: "1:504484947768:web:09b3040669d558bc0ac3cd",
          measurementId: "G-2BE5RYWLYZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.auth = auth;
        window.db = db;
        window.FB = { ref, set, get, child, onValue, push, update, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                await loadUserData(user.uid);
                listenToRoomMatches();

            } else {
                window.currentUser = null;
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');

        });
    </script>

    <!-- AUDIO ENGINE & COMMENTARY SYNTHESIZER -->
    <script>
        const AudioEngine = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            playWhistle() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            },
            playGoalSound() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.6);
            },
            speak(text) {
                if ('speechSynthesis' in window) {
                    const speech = new SpeechSynthesisUtterance(text);
                    speech.lang = 'ar-SA';
                    speech.rate = 1.15;
                    window.speechSynthesis.speak(speech);
                }
            }
        };
    </script>

    <!-- GAME CODE LOGIC -->
    <script>
        let currentAuthMode = 'login';
        let userProfile = null;
        let activeTab = 'squad';

        const MASTER_PLAYERS = [
            { id: 'p1', name: 'محمد صلاح', pos: 'RW', rating: 91, price: 50.0, wage: 3.5, photo: 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=120&auto=format&fit=crop&q=60' },
            { id: 'p2', name: 'كيليان مبابي', pos: 'ST', rating: 93, price: 70.0, wage: 4.5, photo: 'https://images.unsplash.com/photo-1518091043644-c1d4457512c6?w=120&auto=format&fit=crop&q=60' },
            { id: 'p3', name: 'جود بلينغهام', pos: 'CM', rating: 89, price: 45.0, wage: 2.8, photo: 'https://images.unsplash.com/photo-1543326727-cf6c39e8f84c?w=120&auto=format&fit=crop&q=60' },
            { id: 'p4', name: 'فيرجيل فانديك', pos: 'CB', rating: 89, price: 40.0, wage: 2.5, photo: 'https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=120&auto=format&fit=crop&q=60' },
            { id: 'p5', name: 'ياسين بونو', pos: 'GK', rating: 86, price: 25.0, wage: 1.8, photo: 'https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=120&auto=format&fit=crop&q=60' }
        ];

        const MASTER_MANAGERS = [
            { id: 'm1', name: 'بيب جوارديولا', tactic: 'Tiki-Taka & Possession', boost: 6, salary: 25.0, photo: '👔🇪🇸' },
            { id: 'm2', name: 'كارلو أنشيلوتي', tactic: 'Counter-Attack & Calm', boost: 5, salary: 20.0, photo: '👔🇮🇹' }
        ];

        function toggleAuthTab(mode) {
            currentAuthMode = mode;
            document.getElementById('reg-fields').classList.toggle('hidden', mode === 'login');
            document.getElementById('tab-login-btn').className = mode === 'login' ? 'w-1/2 py-2 rounded-lg bg-amber-500 text-slate-950 font-bold' : 'w-1/2 py-2 rounded-lg text-slate-400 font-bold';
            document.getElementById('tab-register-btn').className = mode === 'register' ? 'w-1/2 py-2 rounded-lg bg-amber-500 text-slate-950 font-bold' : 'w-1/2 py-2 rounded-lg text-slate-400 font-bold';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            try {
                if (currentAuthMode === 'register') {
                    const managerName = document.getElementById('auth-manager-name').value || 'كابتن';
                    const clubName = document.getElementById('auth-club-name').value || 'الفرسان FC';
                    const badge = document.getElementById('auth-club-badge').value;

                    const res = await window.FB.createUserWithEmailAndPassword(window.auth, email, password);
                    const uid = res.user.uid;

                    const initialProfile = {
                        uid, email, managerName, clubName, badge,
                        balance: 300.0, squad: [MASTER_PLAYERS[0], MASTER_PLAYERS[4]], hiredManager: null, createdAt: Date.now()
                    };

                    await window.FB.set(window.FB.ref(window.db, 'users/' + uid), initialProfile);
                } else {
                    await window.FB.signInWithEmailAndPassword(window.auth, email, password);
                }
            } catch(err) {
                alert("⚠️ خطأ في التسجيل: " + err.message);
            }
        }

        async function loadUserData(uid) {
            window.FB.onValue(window.FB.ref(window.db, 'users/' + uid), (snapshot) => {
                userProfile = snapshot.val();
                if (userProfile) {
                    document.getElementById('header-club-name').innerText = userProfile.clubName;
                    document.getElementById('header-manager-name').innerText = `المدرب: ${userProfile.managerName}`;
                    document.getElementById('header-badge').innerText = userProfile.badge;
                    document.getElementById('header-balance').innerText = `€${userProfile.balance.toFixed(1)}M`;
                    renderTab();
                }
            });
        }

        function switchTab(tab) {
            activeTab = tab;
            ['squad', 'market', 'managers', 'rooms', 'cup'].forEach(t => {
                document.getElementById(`nav-${t}`).className = t === tab ? 'py-2 rounded-xl bg-amber-500 text-slate-950 font-bold shadow' : 'py-2 rounded-xl text-slate-400 font-bold';
            });
            renderTab();
        }

        function calculateTeamPower() {
            if (!userProfile || !userProfile.squad) return 0;
            const avg = Math.round(userProfile.squad.reduce((a, b) => a + b.rating, 0) / userProfile.squad.length);
            return avg + (userProfile.hiredManager ? userProfile.hiredManager.boost : 0);
        }

        function renderTab() {
            const container = document.getElementById('tab-content');
            if (!userProfile) return;

            if (activeTab === 'squad') {
                container.innerHTML = `
                    <div class="glass p-4 rounded-2xl space-y-3">
                        <div class="flex justify-between items-center bg-slate-900/90 p-3 rounded-xl border border-slate-800">
                            <div>
                                <h3 class="text-sm font-black text-white">${userProfile.clubName}</h3>
                                <span class="text-[10px] text-emerald-400 font-bold">عدد اللاعبين: ${userProfile.squad.length}</span>
                            </div>
                            <span class="text-lg font-black text-amber-300 bg-amber-500/10 px-3 py-1 rounded-xl border border-amber-500/30">⚡${calculateTeamPower()}</span>
                        </div>
                        <div class="space-y-2">
                            ${userProfile.squad.map(p => `
                                <div class="bg-slate-900 p-2 rounded-xl border border-slate-800 flex justify-between items-center">
                                    <div class="flex items-center gap-2">
                                        <img src="${p.photo}" class="w-8 h-8 rounded-lg object-cover">
                                        <h5 class="text-xs font-bold text-white">${p.name} (${p.pos})</h5>
                                    </div>
                                    <span class="text-xs font-bold text-amber-400">⚡${p.rating}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (activeTab === 'rooms') {
                container.innerHTML = `
                    <div class="glass p-4 rounded-2xl space-y-4">
                        <div class="text-center bg-slate-900 p-3 rounded-xl border border-slate-800">
                            <h3 class="text-sm font-black text-amber-400">🔑 نظام الغرف والمواجهات المباشرة الحيّة</h3>
                            <p class="text-[10px] text-slate-400 mt-1">أنشئ روم خاص وانطلق لمشاهدة البث الحي بالتعليق العربي!</p>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="createPrivateRoom()" class="py-3 bg-amber-500 font-black text-slate-950 rounded-xl text-xs">➕ إنشاء غرفة</button>
                            <div class="flex gap-1">
                                <input type="text" id="join-room-code" placeholder="رمز الكود" class="w-2/3 bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-center outline-none">
                                <button onclick="joinPrivateRoom()" class="w-1/3 bg-emerald-500 text-slate-950 font-black rounded-xl text-xs">دخول</button>
                            </div>
                        </div>
                        <div id="rooms-list" class="space-y-2">جاري تحميل الغرف...</div>
                    </div>
                `;
            } else if (activeTab === 'cup') {
                renderCupTab(container);
            }
        }

        // --- LIVE MATCH SIMULATOR WITH COMMENTARY ---
        function startLiveMatchSimulation(homeName, awayName, onComplete) {
            const modal = document.getElementById('live-match-modal');
            const timerEl = document.getElementById('match-timer');
            const homeScoreEl = document.getElementById('home-team-score');
            const awayScoreEl = document.getElementById('away-team-score');
            const feedEl = document.getElementById('commentary-feed');

            document.getElementById('home-team-name').innerText = homeName;
            document.getElementById('away-team-name').innerText = awayName;
            homeScoreEl.innerText = '0';
            awayScoreEl.innerText = '0';
            feedEl.innerHTML = '';
            modal.classList.remove('hidden');

            AudioEngine.playWhistle();
            AudioEngine.speak(`انطلقت المباراة المباشرة الآن بين ${homeName} و ${awayName}`);

            let minute = 0;
            let homeScore = 0;
            let awayScore = 0;

            const commentaryEvents = [
                "كرة تتنقل في وسط الملعب بين الأقدام...",
                "تمريرة ساحرة وخلف المدافعين!",
                "تسديدة قوية يرفعها المهاجم ولكن بجوار القائم!",
                "انطلاقة سرعة صاروخية عبر الأجنحة...",
                "تدخل دفاعي صلب يقطع الكرة في الوقت المناسب!"
            ];

            const interval = setInterval(() => {
                minute += 10;
                timerEl.innerText = `${minute}'`;

                // Random Dynamic Events
                if (Math.random() < 0.35) {
                    const isHome = Math.random() > 0.5;
                    if (isHome) homeScore++; else awayScore++;
                    
                    homeScoreEl.innerText = homeScore;
                    awayScoreEl.innerText = awayScore;

                    const goalTeam = isHome ? homeName : awayName;
                    const log = `<p class="text-[10px] text-amber-400 font-black animate-bounce">⚽ دقيقة ${minute}': جوووووول! هدف لصالح ${goalTeam}!</p>`;
                    feedEl.innerHTML = log + feedEl.innerHTML;
                    
                    AudioEngine.playGoalSound();
                    AudioEngine.speak(`هدف لصالح ${goalTeam}!`);
                } else {
                    const randomComment = commentaryEvents[Math.floor(Math.random() * commentaryEvents.length)];
                    feedEl.innerHTML = `<p class="text-[10px] text-slate-300">دقيقة ${minute}': ${randomComment}</p>` + feedEl.innerHTML;
                }

                if (minute >= 90) {
                    clearInterval(interval);
                    AudioEngine.playWhistle();
                    feedEl.innerHTML = `<p class="text-[10px] text-emerald-400 font-bold">🏁 صافرة النهاية! انتهت المباراة بنتيجة ${homeScore} - ${awayScore}</p>` + feedEl.innerHTML;
                    setTimeout(() => {
                        modal.classList.add('hidden');
                        if (onComplete) onComplete(homeScore, awayScore);
                    }, 4000);
                }
            }, 1200);
        }

        // --- PRIVATE ROOM SYSTEM ---
        async function createPrivateRoom() {
            const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            await window.FB.set(window.FB.ref(window.db, 'rooms/' + roomCode), {
                code: roomCode, hostUid: userProfile.uid, hostClub: userProfile.clubName, status: 'waiting'
            });
            alert(`🔑 تم إنشاء الغرفة!\nالكود: (${roomCode})`);
        }

        async function joinPrivateRoom() {
            const code = document.getElementById('join-room-code').value.trim();
            const snap = await window.FB.get(window.FB.ref(window.db, 'rooms/' + code));
            if (!snap.exists()) return alert("⚠️ الكود غير صحيح!");
            const r = snap.val();

            startLiveMatchSimulation(r.hostClub, userProfile.clubName, async (hScore, aScore) => {
                await window.FB.update(window.FB.ref(window.db, 'rooms/' + code), {
                    guestClub: userProfile.clubName, status: 'finished', score: `${hScore} - ${aScore}`
                });
            });
        }

        function listenToRoomMatches() {
            window.FB.onValue(window.FB.ref(window.db, 'rooms'), (snapshot) => {
                const list = document.getElementById('rooms-list');
                if (!list) return;
                const rooms = snapshot.val();
                if (!rooms) return list.innerHTML = '<p class="text-xs text-slate-500 text-center">لا توجد غرف مفتوحة.</p>';
                list.innerHTML = Object.keys(rooms).map(code => `
                    <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                        <span class="font-bold text-amber-400">غرفة #${rooms[code].code} (${rooms[code].hostClub})</span>
                        <span class="text-[10px] ${rooms[code].status === 'waiting' ? 'text-emerald-400' : 'text-slate-500'} font-bold">${rooms[code].status === 'waiting' ? 'بانتظار المنافس...' : 'مكتملة (' + rooms[code].score + ')'}</span>
                    </div>
                `).join('');
            });
        }

        // --- 16-PLAYER AUTOMATED TOURNAMENT CUP SYSTEM ---
        async function joinCupTournament() {
            const cupRef = window.FB.ref(window.db, 'tournament_cup');
            const snap = await window.FB.get(cupRef);
            let tournament = snap.val() || { participants: [], status: 'registration', schedule: null };

            if (tournament.participants.some(p => p.uid === userProfile.uid)) {
                return alert("⚠️ أنت مشترك بالفعل في هذه البطولة!");
            }

            tournament.participants.push({ uid: userProfile.uid, clubName: userProfile.clubName });

            // Automatically Generate Schedule When Reaching 16 Players
            if (tournament.participants.length >= 16) {
                tournament.status = 'scheduled';
                tournament.schedule = generateTournamentSchedule(tournament.participants);
            }

            await window.FB.set(cupRef, tournament);
            alert("✅ تم الاشتراك بنجاح في بطولة الكأس 16!");
        }

        function generateTournamentSchedule(participants) {
            const schedule = [];
            const times = ["06:00 مساءً", "07:30 مساءً", "09:00 مساءً", "10:30 مساءً"];
            for (let i = 0; i < 8; i++) {
                schedule.push({
                    matchId: i + 1,
                    teamA: participants[i * 2].clubName,
                    teamB: participants[i * 2 + 1].clubName,
                    time: times[i % times.length],
                    day: "اليوم"
                });
            }
            return schedule;
        }

        function listenToCupTournament() {
            window.FB.onValue(window.FB.ref(window.db, 'tournament_cup'), (snap) => {
                window.tournamentData = snap.val();
                if (activeTab === 'cup') renderTab();
            });
        }

        function renderCupTab(container) {
            const tour = window.tournamentData || { participants: [], status: 'registration' };
            const count = tour.participants ? tour.participants.length : 0;
            const isJoined = tour.participants && tour.participants.some(p => p.uid === userProfile.uid);

            container.innerHTML = `
                <div class="glass p-4 rounded-2xl space-y-4 text-center">
                    <div class="bg-gradient-to-r from-amber-500/20 via-slate-900 to-amber-500/20 p-4 rounded-xl border border-amber-500/30">
                        <span class="text-4xl block mb-1">🏆</span>
                        <h3 class="text-base font-black text-amber-400">بطولة الكأس الملكية الكبرى (16 لاعب)</h3>
                        <p class="text-[10px] text-slate-300 mt-1">اشترك الآن، وعند إكتمال 16 لاعب تبدأ المواجهات بمواعيد محددة!</p>
                        
                        <div class="mt-3 bg-slate-950 p-2 rounded-xl border border-slate-800">
                            <span class="text-xs text-emerald-400 font-bold block">المشاركون حالياً: ${count} / 16</span>
                            <div class="w-full bg-slate-800 h-2 rounded-full mt-1 overflow-hidden">
                                <div class="bg-amber-400 h-full" style="width: ${(count/16)*100}%"></div>
                            </div>
                        </div>
                    </div>

                    ${tour.status === 'registration' ? `
                        <button onclick="joinCupTournament()" ${isJoined ? 'disabled' : ''} class="w-full py-3.5 ${isJoined ? 'bg-slate-800 text-slate-500' : 'gold-gradient text-slate-950'} font-black rounded-xl text-xs">
                            ${isJoined ? '✅ تم الاشتراك (بانتظار اكتمال 16 لاعب)' : '✍️ الاشتراك في البطولة (€150M الجائزة)'}
                        </button>
                    ` : `
                        <div class="space-y-2 text-right">
                            <h4 class="text-xs font-black text-amber-400">📅 جدول المواجهات المحدد بالوقت واليوم:</h4>
                            ${tour.schedule.map(m => `
                                <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                                    <div>
                                        <span class="font-bold text-white block">${m.teamA} 🆚 ${m.teamB}</span>
                                        <span class="text-[9px] text-amber-400">${m.day} - الساعة: ${m.time}</span>
                                    </div>
                                    <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-1 rounded-lg font-bold">مجدولة</span>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }
    </script>
</body>
</html>
